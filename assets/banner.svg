<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#ec4899" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="card-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#111827" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      @keyframes pulse-wave {
        0%, 100% { transform: scaleY(0.4); opacity: 0.3; }
        50% { transform: scaleY(1.1); opacity: 0.9; }
      }
      @keyframes float-particle {
        0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
        50% { transform: translateY(-15px) translateX(10px); opacity: 0.7; }
        100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      }
      @keyframes gradient-shift {
        0% { stop-color: #8b5cf6; }
        33% { stop-color: #ec4899; }
        66% { stop-color: #3b82f6; }
        100% { stop-color: #8b5cf6; }
      }

      .wave-bar {
        transform-origin: bottom;
        animation: pulse-wave 2.5s ease-in-out infinite;
      }
      .wb-1 { animation-delay: 0.1s; }
      .wb-2 { animation-delay: 0.3s; }
      .wb-3 { animation-delay: 0.5s; }
      .wb-4 { animation-delay: 0.7s; }
      .wb-5 { animation-delay: 0.9s; }
      .wb-6 { animation-delay: 1.1s; }
      .wb-7 { animation-delay: 1.3s; }
      .wb-8 { animation-delay: 1.5s; }

      .particle {
        animation: float-particle 4s ease-in-out infinite;
      }
      .pt-1 { animation-delay: 0.2s; }
      .pt-2 { animation-delay: 1.2s; }
      .pt-3 { animation-delay: 2.2s; }

      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 48px;
        fill: #ffffff;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 20px;
        fill: #9ca3af;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 14px;
        fill: #e5e7eb;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="400" rx="16" fill="url(#bg-gradient)"/>
  
  <!-- Subtle Grid Pattern Background -->
  <g opacity="0.08">
    <path d="M0,50 H1200 M0,100 H1200 M0,150 H1200 M0,200 H1200 M0,250 H1200 M0,300 H1200 M0,350 H1200" stroke="#ffffff" stroke-width="1"/>
    <path d="M100,0 V400 M200,0 V400 M300,0 V400 M400,0 V400 M500,0 V400 M600,0 V400 M700,0 V400 M800,0 V400 M900,0 V400 M1000,0 V400 M1100,0 V400" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- Ambient Glow Orbs (Background Layer) -->
  <circle cx="200" cy="100" r="140" fill="#8b5cf6" opacity="0.15" filter="url(#glow)"/>
  <circle cx="1000" cy="300" r="160" fill="#ec4899" opacity="0.15" filter="url(#glow)"/>
  <circle cx="950" cy="80" r="120" fill="#3b82f6" opacity="0.12" filter="url(#glow)"/>

  <!-- Dynamic Floating Particles (Background Layer) -->
  <circle cx="150" cy="280" r="4" fill="#a78bfa" class="particle pt-1"/>
  <circle cx="250" cy="80" r="3" fill="#f472b6" class="particle pt-2"/>
  <circle cx="1080" cy="160" r="5" fill="#60a5fa" class="particle pt-3"/>
  <circle cx="920" cy="320" r="3" fill="#c084fc" class="particle pt-1"/>

  <!-- Audio Wave Visualizer (Positioned Safely at Bottom Right / Background) -->
  <g transform="translate(820, 260)" opacity="0.6">
    <rect class="wave-bar wb-1" x="0" y="-100" width="8" height="100" rx="4" fill="#8b5cf6"/>
    <rect class="wave-bar wb-2" x="16" y="-130" width="8" height="130" rx="4" fill="#a78bfa"/>
    <rect class="wave-bar wb-3" x="32" y="-90" width="8" height="90" rx="4" fill="#c084fc"/>
    <rect class="wave-bar wb-4" x="48" y="-160" width="8" height="160" rx="4" fill="#ec4899"/>
    <rect class="wave-bar wb-5" x="64" y="-120" width="8" height="120" rx="4" fill="#f472b6"/>
    <rect class="wave-bar wb-6" x="80" y="-180" width="8" height="180" rx="4" fill="#3b82f6"/>
    <rect class="wave-bar wb-7" x="96" y="-110" width="8" height="110" rx="4" fill="#60a5fa"/>
    <rect class="wave-bar wb-8" x="112" y="-70" width="8" height="70" rx="4" fill="#93c5fd"/>
    <rect class="wave-bar wb-3" x="128" y="-140" width="8" height="140" rx="4" fill="#a78bfa"/>
    <rect class="wave-bar wb-1" x="144" y="-90" width="8" height="90" rx="4" fill="#8b5cf6"/>
  </g>

  <!-- Accent Line Below Title -->
  <rect x="80" y="205" width="640" height="4" rx="2" fill="url(#primary-glow)"/>

  <!-- FOREGROUND CONTENT: Header & Subtitle (Completely Unobscured) -->
  <g transform="translate(80, 0)">
    <!-- Decorative Icon / Logo Badge -->
    <g transform="translate(0, 72)">
      <rect x="0" y="0" width="48" height="48" rx="12" fill="#1f2937" stroke="#374151" stroke-width="1.5"/>
      <!-- Microphone / Soundwave Icon -->
      <path d="M24 14 C21.79 14 20 15.79 20 18 V26 C20 28.21 21.79 30 24 30 C26.21 30 28 28.21 28 26 V18 C28 15.79 26.21 14 24 14 Z" fill="#ec4899"/>
      <path d="M16 25 V26 C16 30.42 19.58 34 24 34 C28.42 34 32 30.42 32 26 V25 M24 34 V38 M20 38 H28" stroke="#a78bfa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>

    <!-- Main Title -->
    <text x="64" y="112" class="title-text">Awesome Text-To-Speech (TTS)</text>

    <!-- Subtitle -->
    <text x="0" y="165" class="subtitle-text">Curated Directory of Neural Voice Synthesis, Voice Cloning &amp; AI Speech Engines</text>

    <!-- Feature Feature Pills in Foreground -->
    <g transform="translate(0, 235)">
      <!-- Pill 1: Neural Voice Synthesis -->
      <g transform="translate(0, 0)">
        <rect width="180" height="36" rx="18" fill="url(#card-bg)" stroke="#8b5cf6" stroke-opacity="0.5" stroke-width="1.5"/>
        <text x="16" y="23" class="pill-text">🧠 Neural Synthesis</text>
      </g>

      <!-- Pill 2: Voice Cloning -->
      <g transform="translate(195, 0)">
        <rect width="155" height="36" rx="18" fill="url(#card-bg)" stroke="#ec4899" stroke-opacity="0.5" stroke-width="1.5"/>
        <text x="16" y="23" class="pill-text">🎙️ Voice Cloning</text>
      </g>

      <!-- Pill 3: Real-Time Latency -->
      <g transform="translate(365, 0)">
        <rect width="165" height="36" rx="18" fill="url(#card-bg)" stroke="#3b82f6" stroke-opacity="0.5" stroke-width="1.5"/>
        <text x="16" y="23" class="pill-text">⚡ &lt;200ms Latency</text>
      </g>

      <!-- Pill 4: Open-Source Models -->
      <g transform="translate(545, 0)">
        <rect width="175" height="36" rx="18" fill="url(#card-bg)" stroke="#10b981" stroke-opacity="0.5" stroke-width="1.5"/>
        <text x="16" y="23" class="pill-text">🌟 Open-Source SOTA</text>
      </g>
    </g>

    <!-- Footer Stats / Meta Line -->
    <g transform="translate(0, 310)">
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#6b7280" font-weight="500">
        Updated October 2026  •  SaaS &amp; Self-Hosted Voice Ecosystem  •  Apache-2.0 / MIT / Enterprise
      </text>
    </g>
  </g>
</svg>
