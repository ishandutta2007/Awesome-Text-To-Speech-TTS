<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 400"><defs><linearGradient id="bg-gradient" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0b0f19"/><stop offset="50%" stop-color="#111827"/><stop offset="100%" stop-color="#070a12"/></linearGradient><linearGradient id="primary-glow" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#8b5cf6" stop-opacity=".8"/><stop offset="50%" stop-color="#ec4899" stop-opacity=".8"/><stop offset="100%" stop-color="#3b82f6" stop-opacity=".8"/></linearGradient><linearGradient id="card-bg" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1f2937" stop-opacity=".6"/><stop offset="100%" stop-color="#111827" stop-opacity=".4"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="15"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="soft-glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><style>@keyframes pulse-wave{0%{transform:scaleY(.4);opacity:.3}50%{transform:scaleY(1.1);opacity:.9}}@keyframes float-particle{0%{transform:translateY(0) translateX(0);opacity:.2}50%{transform:translateY(-15px) translateX(10px);opacity:.7}}@keyframes gradient-shift{0%{stop-color:#8b5cf6}33%{stop-color:#ec4899}66%{stop-color:#3b82f6}}.wave-bar{transform-origin:bottom;animation:pulse-wave 2.5s ease-in-out infinite}.wb-1{animation-delay:.1s}.wb-2{animation-delay:.3s}.wb-3{animation-delay:.5s}.wb-4{animation-delay:.7s}.wb-5{animation-delay:.9s}.wb-6{animation-delay:1.1s}.wb-7{animation-delay:1.3s}.wb-8{animation-delay:1.5s}.particle{animation:float-particle 4s ease-in-out infinite}.pt-1{animation-delay:.2s}.pt-2{animation-delay:1.2s}.pt-3{animation-delay:2.2s}.pill-text,.subtitle-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;font-size:48px;fill:#fff;letter-spacing:-.5px}.subtitle-text{font-weight:400;font-size:20px;fill:#9ca3af}.pill-text{font-weight:600;font-size:14px;fill:#e5e7eb}</style></defs><rect width="1200" height="400" fill="url(#bg-gradient)" rx="16"/><g opacity=".08"><path stroke="#fff" stroke-width="1" d="M0,50 H1200 M0,100 H1200 M0,150 H1200 M0,200 H1200 M0,250 H1200 M0,300 H1200 M0,350 H1200"/><path stroke="#fff" stroke-width="1" d="M100,0 V400 M200,0 V400 M300,0 V400 M400,0 V400 M500,0 V400 M600,0 V400 M700,0 V400 M800,0 V400 M900,0 V400 M1000,0 V400 M1100,0 V400"/></g><circle cx="200" cy="100" r="140" fill="#8b5cf6" filter="url(#glow)" opacity=".15"/><circle cx="1000" cy="300" r="160" fill="#ec4899" filter="url(#glow)" opacity=".15"/><circle cx="950" cy="80" r="120" fill="#3b82f6" filter="url(#glow)" opacity=".12"/><circle cx="150" cy="280" r="4" fill="#a78bfa" class="particle pt-1"/><circle cx="250" cy="80" r="3" fill="#f472b6" class="particle pt-2"/><circle cx="1080" cy="160" r="5" fill="#60a5fa" class="particle pt-3"/><circle cx="920" cy="320" r="3" fill="#c084fc" class="particle pt-1"/><g opacity=".6" transform="translate(820, 260)"><rect width="8" height="100" x="0" y="-100" fill="#8b5cf6" class="wave-bar wb-1" rx="4"/><rect width="8" height="130" x="16" y="-130" fill="#a78bfa" class="wave-bar wb-2" rx="4"/><rect width="8" height="90" x="32" y="-90" fill="#c084fc" class="wave-bar wb-3" rx="4"/><rect width="8" height="160" x="48" y="-160" fill="#ec4899" class="wave-bar wb-4" rx="4"/><rect width="8" height="120" x="64" y="-120" fill="#f472b6" class="wave-bar wb-5" rx="4"/><rect width="8" height="180" x="80" y="-180" fill="#3b82f6" class="wave-bar wb-6" rx="4"/><rect width="8" height="110" x="96" y="-110" fill="#60a5fa" class="wave-bar wb-7" rx="4"/><rect width="8" height="70" x="112" y="-70" fill="#93c5fd" class="wave-bar wb-8" rx="4"/><rect width="8" height="140" x="128" y="-140" fill="#a78bfa" class="wa